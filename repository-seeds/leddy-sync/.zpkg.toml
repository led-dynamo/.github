[package]
org = "led-dynamo"
name = "leddy-sync"
version = "0.1.0"
description = "Deterministic synchronization primitives for the Leddy fleet"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/led-dynamo/leddy-sync"

[install]
adapter = "rust"
dir = ".vendor/.zed"

[dependencies]
"led-dynamo/leddy-interfaces" = "^0.1.0"
"led-dynamo/leddy-lib" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = ["target/**", ".vendor/**", ".zed/**", ".env", ".env.*", "*.log"]

[publish.native]
registry = "crates-io"
package = "leddy-sync"

[scripts]
test = "cargo test --all-targets --all-features"

[package]
name = "leddy-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Read-only official-rmcp server for canonical Leddy API documentation"
license = "MIT"
repository = "https://github.com/led-dynamo/leddy-mcp-server.rs"
publish = false

[[bin]]
name = "leddy-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "=3.1.0", features = ["server", "macros", "schemars", "transport-io"] }
rmcp-macros = "=3.1.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

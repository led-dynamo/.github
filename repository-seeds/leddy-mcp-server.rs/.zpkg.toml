[package]
org = "led-dynamo"
name = "leddy-mcp-server"
version = "0.1.0"
description = "Read-only official-rmcp server for canonical Leddy API documentation"
license = "MIT"
keywords = ["api-docs", "led-matrix", "mcp", "rust", "zed"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/led-dynamo/leddy-mcp-server.rs"

[dependencies]
"led-dynamo/leddy-clients" = "^0.1.0"
"led-dynamo/leddy-interfaces" = "^0.1.0"
"led-dynamo/leddy-lib" = "^0.1.0"
"led-dynamo/leddy-cli" = "^0.1.0"
"led-dynamo/leddy-sync" = "^0.1.0"
"shared-auth/shared-auth-clients" = "^0.1.0"

[build]
command = "cargo build --release --locked"
outputs = ["target/release/leddy-mcp-server"]

[bin]
leddy-mcp-server = "target/release/leddy-mcp-server"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/leddy-mcp-server\""
exclude = [
  "target/**",
  ".vendor/**",
  ".zed/**",
  ".env",
  ".env.*",
  "*.log",
]

[scripts]
test = "cargo test --locked --all-targets --all-features"

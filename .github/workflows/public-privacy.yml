name: public-privacy-boundary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Rust public privacy validator
        run: cargo test --manifest-path tools/public-privacy-validator/Cargo.toml --all-targets
      - name: Exercise fail-closed privacy fixture
        run: cargo run --quiet --manifest-path tools/public-privacy-validator/Cargo.toml -- --self-test
      - name: Reject private repository references
        run: cargo run --quiet --manifest-path tools/public-privacy-validator/Cargo.toml -- .
